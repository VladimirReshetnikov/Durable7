[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "durable7"
version = "0.1.0"
description = "Persistent data structures, authenticated collections, and fixed-width numerics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT-0"
authors = [{ name = "Durable7 contributors" }]
keywords = [
  "persistent-data-structures",
  "hamt",
  "finger-tree",
  "merkle-tree",
  "numerics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/VladimirReshetnikov/Durable7"

[tool.setuptools.packages.find]
where = ["src"]
include = ["durable7*"]
namespaces = true

[tool.setuptools.package-data]
"durable7" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
minversion = "9.1"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
show_error_codes = true
warn_unreachable = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017"]

[tool.ruff.format]
docstring-code-format = true
